name: GD32
# Compile test of the GD32 support (ArduinoCore-GD32 core), like stm32.yml / esp32.yml for their cores.
# The Arduino IDE package of ArduinoCore-GD32 has no archive checksum (arduino-cli refuses it): built with PlatformIO
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLATFORM: https://github.com/CommunityGD32Cores/platform-gd32.git
      CORE: framework-arduinogd32@https://github.com/CommunityGD32Cores/ArduinoCore-GD32.git
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-gd32
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio
      # pio ci checks the board before installing the platform: install it first
      - name: Install platform-gd32
        run: pio pkg install --global --platform "$PLATFORM"

      # GD32F1x0: the only family with hardware specific code (6PWM, low side current sense).
      # Builds the split board example, which uses both.
      - name: PIO Run GD32F130 split board
        run: >
          pio ci --lib="." --board=genericGD32F130C8
          --project-option="platform=$PLATFORM" --project-option="framework=arduino" --project-option="platform_packages=$CORE"
          --project-option="build_flags=-DSIMPLEFOC_PWM_LOWSIDE_ACTIVE_HIGH=false"
        env:
          PLATFORMIO_CI_SRC: examples/hardware_specific_examples/GD32/split_hoverboard/gd32_split_hoverboard.ino

      # Other GD32 families (F10x, F30x, E23x...): the GD32 code above is only for the GD32F1x0
      # (#if defined(GD32F1x0) in src/drivers and src/current_sense hardware_specific/gd32). On the other families
      # it must be left out and SimpleFOC must still build with its generic functions, as it did before the GD32
      # driver existed. This step checks that guard on a GD32F303, so a change of the GD32 code cannot break the
      # build for the users of the other GD32 families.
      - name: PIO Run GD32F303 (other GD32 families, generic functions)
        run: >
          pio ci --lib="." --board=genericGD32F303CC
          --project-option="platform=$PLATFORM" --project-option="framework=arduino" --project-option="platform_packages=$CORE"
        env:
          PLATFORMIO_CI_SRC: examples/utils/driver_standalone_test/bldc_driver_6pwm_standalone/bldc_driver_6pwm_standalone.ino
