name: GD32
on: [push, pull_request]
jobs:
  build:
    name: Test compiling
    runs-on: ubuntu-latest

    strategy:
      matrix:
        arduino-boards-fqbn:
          - GD32Community:gd32:gd_generic_gd32f1x0:pnum=GD32F130C8_GENERIC   # gd32f130 - hoverboard split board

        include:
          - arduino-boards-fqbn: GD32Community:gd32:gd_generic_gd32f1x0:pnum=GD32F130C8_GENERIC # hoverboard split board
            platform-url: https://raw.githubusercontent.com/CommunityGD32Cores/GD32Core-New/main/package_gd32_index.json
            sketch-names: gd32_split_hoverboard.ino
            build-properties:
              gd32_split_hoverboard:
                -DSIMPLEFOC_PWM_LOWSIDE_ACTIVE_HIGH=false

      # Do not cancel all jobs / architectures if one job fails
      fail-fast: false
    steps:
    - name: Checkout
      uses: actions/checkout@master
    - name: Compile all examples
      uses: ArminJo/arduino-test-compile@master
      with:
          arduino-board-fqbn: ${{ matrix.arduino-boards-fqbn }}
          required-libraries: ${{ matrix.required-libraries }}
          platform-url: ${{ matrix.platform-url }}
          sketch-names: ${{ matrix.sketch-names }}
          sketches-exclude: ${{ matrix.sketches-exclude }}
          build-properties: ${{ toJson(matrix.build-properties) }}
